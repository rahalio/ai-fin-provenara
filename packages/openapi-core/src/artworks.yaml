openapi: 3.1.0
info:
  title: Provenara Artworks API
  version: 0.1.0
  description: Artwork trust files and readiness.
  x-domain: art
  x-domain-prefix: ART
  license:
    name: Proprietary
servers:
  - url: https://api.provenara.local
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - name: Artworks
  - name: TrustFiles
paths:
  /v1/artworks:
    get:
      operationId: listArtworks
      summary: List Artworks
      tags: [Artworks]
      x-repository: Artwork
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: readiness
          in: query
          schema:
            type: string
            enum: [complete, mismatch, staleMark, uninsured, incomplete]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./artworks.schemas.yaml#/components/schemas/ArtworkListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createArtwork
      summary: Create Artwork
      tags: [Artworks]
      x-repository: Artwork
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./artworks.schemas.yaml#/components/schemas/ArtworkCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./artworks.schemas.yaml#/components/schemas/ArtworkResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/artworks/{artworkId}:
    parameters:
      - name: artworkId
        in: path
        required: true
        schema:
          $ref: ./artworks.schemas.yaml#/components/schemas/ArtworkId
    get:
      operationId: getArtwork
      summary: Get Artwork
      tags: [Artworks]
      x-repository: Artwork
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./artworks.schemas.yaml#/components/schemas/ArtworkResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/artworks/{artworkId}/trust-file:
    parameters:
      - name: artworkId
        in: path
        required: true
        schema:
          $ref: ./artworks.schemas.yaml#/components/schemas/ArtworkId
    get:
      operationId: getTrustFile
      summary: Get Trust File
      tags: [TrustFiles]
      x-repository: TrustFile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./artworks.schemas.yaml#/components/schemas/TrustFileResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
