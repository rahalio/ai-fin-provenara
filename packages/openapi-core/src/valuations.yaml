openapi: 3.1.0
info:
  title: Provenara Valuations API
  version: 0.1.0
  description: Valuation marks and credit expiry.
  x-domain: val
  x-domain-prefix: VAL
  license:
    name: Proprietary
servers:
  - url: https://api.provenara.local
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - name: Valuations
paths:
  /v1/artworks/{artworkId}/valuations:
    parameters:
      - name: artworkId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listValuations
      summary: List Valuation Marks
      tags: [Valuations]
      x-repository: ValuationMark
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./valuations.schemas.yaml#/components/schemas/ValuationMarkListResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: addValuation
      summary: Add Valuation Mark
      tags: [Valuations]
      x-repository: ValuationMark
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./valuations.schemas.yaml#/components/schemas/ValuationMarkCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./valuations.schemas.yaml#/components/schemas/ValuationMarkResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/artworks/{artworkId}/valuations/{valuationId}/expire:
    parameters:
      - name: artworkId
        in: path
        required: true
        schema:
          type: string
      - name: valuationId
        in: path
        required: true
        schema:
          $ref: ./valuations.schemas.yaml#/components/schemas/ValuationMarkId
    post:
      operationId: expireValuation
      summary: Force-Expire Valuation Mark
      tags: [Valuations]
      x-repository: ValuationMark
      responses:
        '200':
          description: Expired
          content:
            application/json:
              schema:
                $ref: ./valuations.schemas.yaml#/components/schemas/ValuationMarkResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
