openapi: 3.1.0
info:
  title: Provenara Provenance API
  version: 0.1.0
  description: Append-only provenance events and document artefacts.
  x-domain: prv
  x-domain-prefix: PRV
  license:
    name: Proprietary
servers:
  - url: https://api.provenara.local
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - name: Provenance
  - name: Documents
paths:
  /v1/artworks/{artworkId}/provenance:
    parameters:
      - name: artworkId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProvenance
      summary: List Provenance Events
      tags: [Provenance]
      x-repository: ProvenanceEvent
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./provenance.schemas.yaml#/components/schemas/ProvenanceEventListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: appendProvenance
      summary: Append Provenance Event
      tags: [Provenance]
      x-repository: ProvenanceEvent
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./provenance.schemas.yaml#/components/schemas/ProvenanceEventCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./provenance.schemas.yaml#/components/schemas/ProvenanceEventResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/artworks/{artworkId}/documents:
    parameters:
      - name: artworkId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listDocumentArtefacts
      summary: List Document Artefacts
      tags: [Documents]
      x-repository: DocumentArtefact
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./provenance.schemas.yaml#/components/schemas/DocumentArtefactListResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: attachDocumentArtefact
      summary: Attach Document Artefact
      tags: [Documents]
      x-repository: DocumentArtefact
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./provenance.schemas.yaml#/components/schemas/DocumentArtefactCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./provenance.schemas.yaml#/components/schemas/DocumentArtefactResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
