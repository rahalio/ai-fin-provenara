openapi: 3.1.0
info:
  title: Provenara Audits API
  version: 0.1.0
  description: Audit exports and optional hash anchors.
  x-domain: aud
  x-domain-prefix: AUD
  license:
    name: Proprietary
servers:
  - url: https://api.provenara.local
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - name: Audits
  - name: Anchors
paths:
  /v1/audits/exports:
    post:
      operationId: createProvenaraAuditExport
      summary: Create Audit Export
      tags: [Audits]
      x-repository: AuditExport
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./audits.schemas.yaml#/components/schemas/AuditExportCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./audits.schemas.yaml#/components/schemas/AuditExportResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/audits/exports/{exportId}:
    parameters:
      - name: exportId
        in: path
        required: true
        schema:
          $ref: ./audits.schemas.yaml#/components/schemas/AuditExportId
    get:
      operationId: getAuditExport
      summary: Get Audit Export
      tags: [Audits]
      x-repository: AuditExport
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./audits.schemas.yaml#/components/schemas/AuditExportResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/artworks/{artworkId}/anchors:
    parameters:
      - name: artworkId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listAnchors
      summary: List Anchor Receipts
      tags: [Anchors]
      x-repository: AnchorReceipt
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./audits.schemas.yaml#/components/schemas/AnchorReceiptListResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: publishAnchor
      summary: Publish Hash Anchor
      tags: [Anchors]
      x-repository: AnchorReceipt
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '201':
          description: Anchor receipt
          content:
            application/json:
              schema:
                $ref: ./audits.schemas.yaml#/components/schemas/AnchorReceiptResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
