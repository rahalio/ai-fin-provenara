openapi: 3.1.0
info:
  title: Valuations schemas
  version: 0.1.0
paths: {}
components:
  schemas:
    ValuationMarkId:
      type: string
      pattern: '^val_[0-9A-HJKMNP-TV-Z]{26}$'
    ValuationMark:
      type: object
      required: [id, tenantId, artworkId, amount, currency, valuedOn, method, valuer, createdAt, updatedAt]
      x-dynamodb:
        domain: VALUATIONS
        entityType: VALUATION_MARK
        entityTypePk: VALUATION_MARKS
        pkPattern: entity
        tableType: core
        softDeleteEnabled: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        gsi2Enabled: true
        gsi2PKFields: [tenantId]
        gsi2SKFields: [updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ValuationMarkId'
        tenantId:
          $ref: ./common/primitives.yaml#/components/schemas/TenantId
        artworkId:
          type: string
        amount:
          type: number
        currency:
          $ref: ./common/primitives.yaml#/components/schemas/Currency
        valuedOn:
          type: string
          format: date
        expiresOn:
          type: string
          format: date
        method:
          type: string
        valuer:
          type: string
        expired:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ValuationMarkCreate:
      type: object
      required: [amount, currency, valuedOn, method, valuer]
      properties:
        amount:
          type: number
        currency:
          $ref: ./common/primitives.yaml#/components/schemas/Currency
        valuedOn:
          type: string
          format: date
        expiresOn:
          type: string
          format: date
        method:
          type: string
        valuer:
          type: string
    ValuationMarkResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ValuationMark'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    ValuationMarkListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ValuationMark'
            nextCursor:
              type: string
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
